<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!--
  첫 화면 검색칸 (Streamlit 사용자 컴포넌트, 외부 라이브러리 없이 HTML·JS만).
  Streamlit 기본 입력칸은 글자를 치는 '도중'에는 반응하지 않아서, 치는 동안 칸 아래에 이름이 들어간 회사 목록(업종·지역·직원 수 포함)을
  바로 보여주려고 직접 만들었다. Enter나 [검색]을 누르면 친 글자를, 아래 목록의 회사를 누르면 그 이름을 Streamlit으로 보낸다.
-->
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; height:auto;
               font-family:"Source Sans Pro","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:#192c49; }
  #wrap { padding:2px 0; }
  .box { display:flex; align-items:center; gap:6px; background:white; border:1px solid #c4d9f5; border-radius:99px;
         box-shadow:0 8px 28px #447bb91c; padding:6px 6px 6px 18px; max-width:760px; position:relative; }
  .box:focus-within { border-color:#0868ec; }
  input { flex:1; min-width:0; border:0; outline:0; font-size:15px; background:transparent; padding:10px 0; color:#192c49;
          font-family:inherit; }
  .roll { position:absolute; left:18px; top:50%; transform:translateY(-50%); color:#8193a8; font-size:15px; pointer-events:none;
          white-space:nowrap; overflow:hidden; max-width:calc(100% - 130px); transition:opacity .35s, transform .35s; }
  .roll.out { opacity:0; transform:translateY(-110%); }
  .roll.in { opacity:0; transform:translateY(10%); }
  .hide { display:none; }
  button.go { background:#0868ec; color:white; border:0; border-radius:99px; min-height:44px; padding:0 26px; font-size:14px;
              font-weight:650; cursor:pointer; font-family:inherit; flex:0 0 auto; }
  button.go:hover { background:#0757c8; }
  .sug { max-width:760px; margin:6px 0 0; background:white; border:1px solid #d3e3f6; border-radius:16px;
         box-shadow:0 10px 30px #447bb924; overflow:hidden; }
  .sug .lab { display:block; font-size:12px; color:#1766bf; font-weight:650; padding:9px 16px 5px; }
  .row { display:flex; align-items:baseline; gap:10px; padding:9px 16px; cursor:pointer; border-top:1px solid #f0f4f9; }
  .row:hover, .row.on { background:#eef5ff; }
  .row b { font-weight:650; font-size:14px; color:#192c49; white-space:nowrap; }
  .row b mark { background:none; color:#0868ec; }
  .row small { font-size:12px; color:#62758d; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.all small { color:#0868ec; }
  @media (max-width:640px) {
    .box { padding:4px 4px 4px 12px; }
    .roll { left:12px; max-width:calc(100% - 100px); }
    button.go { padding:0 16px; min-height:40px; }
    input, .roll { font-size:16px; }
  }
</style>
</head>
<body>
<div id="wrap">
<div class="box">
  <span class="roll" id="roll">🔍  토스</span>
  <input id="q" type="text" autocomplete="off" aria-label="검색" placeholder="">
  <button class="go" id="go" type="button">검색</button>
</div>
<div class="sug hide" id="sug"></div>
</div>
<script>
  const send = (type, extra) => window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, extra), "*");
  // 높이는 내용(검색칸 + 목록) 기준으로 잰다. 창(iframe) 높이로 재면 목록이 닫혀도 줄어들지 않아 아래에 빈칸이 남는다
  let lastH = 0;
  const setHeight = () => {
    const h = Math.ceil(document.getElementById("wrap").getBoundingClientRect().height) + 4;
    if (h !== lastH) { lastH = h; send("streamlit:setFrameHeight", {height: h}); }
  };
  const submit = (text, key) => {
    text = (text || "").trim();
    if (!text) return;
    send("streamlit:setComponentValue", {value: {q: text, key: key || null, t: Date.now()}, dataType: "json"});
    q.value = ""; render(); q.blur();
  };
  const q = document.getElementById("q"), sug = document.getElementById("sug"), roll = document.getElementById("roll");
  let OPTS = [], EXAMPLES = ["토스"], ex = 0, active = -1, shown = [];
  const norm = (s) => s.replace(/\s+/g, "").toLowerCase();
  // 영문 약자는 국민연금 이름처럼 한글로 읽는다 (src/match.py의 LETTERS와 같은 표). kt → 케이티, kt&g → 케이티앤지
  const LET = {a:"에이",b:"비",c:"씨",d:"디",e:"이",f:"에프",g:"지",h:"에이치",i:"아이",j:"제이",k:"케이",l:"엘",m:"엠",
               n:"엔",o:"오",p:"피",q:"큐",r:"알",s:"에스",t:"티",u:"유",v:"브이",w:"더블유",x:"엑스",y:"와이",z:"제트"};
  const hang = (s) => norm(s).replace(/&/g, "앤").replace(/[a-z]+/g, (w) => w.length <= 5 ? [...w].map((c) => LET[c]).join("") : w)
                              .replace(/[^0-9a-z가-힣]/g, "");
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function render() {
    const v = norm(q.value);
    roll.classList.toggle("hide", q.value.length > 0 || document.activeElement === q);
    if (!v || document.activeElement !== q) { sug.classList.add("hide"); sug.innerHTML = ""; shown = []; setHeight(); return; }
    // 이름이 검색어로 시작하는 것 먼저, 그다음 이름에 들어 있는 것. 같은 순위 안에서는 원래 순서(브랜드 → 큰 회사)
    const starts = [], inside = [];
    const vh = hang(q.value);
    for (const o of OPTS) {
      const n = o[5], k = o[6];
      if (n.startsWith(v) || (vh && k.startsWith(vh))) starts.push(o);
      else if (n.includes(v) || (vh && k.includes(vh))) inside.push(o);
      if (starts.length >= 7) break;
    }
    // 이름이 검색어와 똑같은 회사를 맨 앞에 ('쿠팡'을 치면 쿠팡풀필먼트보다 쿠팡이 먼저)
    const exact = OPTS.filter((o) => o[5] === v || (vh && o[6] === vh));
    shown = [...new Set(exact.concat(starts, inside))].slice(0, 7);
    active = -1;
    if (!shown.length) { sug.classList.add("hide"); sug.innerHTML = ""; setHeight(); return; }
    sug.innerHTML = `<span class="lab">'${esc(q.value.trim())}' 들어간 회사 · 누르면 바로 볼 수 있어요</span>` + shown.map((o, i) => {
      const name = esc(o[0]), k = o[0].replace(/\s+/g, "").toLowerCase().indexOf(v);
      const hl = k >= 0 && o[0].indexOf(" ") < 0 ? esc(o[0].slice(0, k)) + "<mark>" + esc(o[0].slice(k, k + v.length)) + "</mark>" + esc(o[0].slice(k + v.length)) : name;
      return `<div class="row" data-i="${i}"><b>${hl}</b><small>${esc(o[1])}</small></div>`;
    }).join("") + `<div class="row all" data-i="-1"><small>🔍 '${esc(q.value.trim())}'(으)로 전체 검색 · Enter</small></div>`;
    sug.classList.remove("hide");
    setHeight();
  }
  sug.addEventListener("mousedown", (e) => {
    const c = e.target.closest(".row");
    if (c) { e.preventDefault(); const o = shown[+c.dataset.i]; +c.dataset.i < 0 ? submit(q.value) : submit(o[2], o[3]); }
  });
  q.addEventListener("input", render);
  q.addEventListener("focus", render);
  q.addEventListener("blur", () => setTimeout(render, 0));
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); active >= 0 ? submit(shown[active][2], shown[active][3]) : submit(q.value); }
    else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && shown.length) {
      e.preventDefault();
      active = (active + (e.key === "ArrowDown" ? 1 : -1) + shown.length) % shown.length;
      [...sug.querySelectorAll(".row:not(.all)")].forEach((c, i) => c.classList.toggle("on", i === active));
    }
  });
  document.getElementById("go").addEventListener("click", () => submit(q.value));
  // 예시 검색어가 3초마다 위로 넘어가며 바뀐다 (칸을 누르거나 글자를 치면 사라진다)
  setInterval(() => {
    if (!EXAMPLES.length) return;
    roll.classList.add("out");
    setTimeout(() => {
      ex = (ex + 1) % EXAMPLES.length;
      roll.textContent = "🔍  " + EXAMPLES[ex];
      roll.classList.remove("out"); roll.classList.add("in");
      requestAnimationFrame(() => requestAnimationFrame(() => roll.classList.remove("in")));
    }, 350);
  }, 3000);
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "streamlit:render") return;
    const a = d.args || {};
    if (a.options && a.options.length !== OPTS.length)
      OPTS = a.options.map((o) => [o[0], o[1], o[2], o[3] || "", o[4] || "", norm(o[0]), (o[4] || hang(o[0]))]);
    if (a.examples) { EXAMPLES = a.examples; roll.textContent = "🔍  " + EXAMPLES[ex % EXAMPLES.length]; }
    setHeight();
  });
  window.addEventListener("resize", setHeight);
  send("streamlit:componentReady", {apiVersion: 1});
  setHeight();
</script>
</body>
</html>
